services:
  postgres:
    image: postgres:16-alpine
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix_secret
      POSTGRES_DB: helix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helix -d helix']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helix-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: helix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: helix_minio
      MINIO_ROOT_PASSWORD: helix_minio_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: helix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set helix http://minio:9000 helix_minio helix_minio_secret;
      mc mb helix/helix-attachments --ignore-existing;
      mc anonymous set download helix/helix-attachments;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: helix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://helix:helix_secret@postgres:5432/helix?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: helix-dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: helix-dev-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: helix_minio
      MINIO_SECRET_KEY: helix_minio_secret
      MINIO_BUCKET: helix-attachments
      MINIO_USE_SSL: 'false'
      CORS_ORIGIN: http://localhost:4200
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: helix-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://localhost:3000/api
      WS_URL: http://localhost:3000
    ports:
      - '4200:4200'
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
